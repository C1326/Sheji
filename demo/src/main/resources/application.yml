server:
  # 端口，可用环境变量 SERVER_PORT 覆盖
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  tomcat:
    max-swallow-size: 100MB

spring:
  datasource:
    # 数据库连接，部署时用 DB_URL / DB_USERNAME / DB_PASSWORD 覆盖
    url: ${DB_URL:jdbc:mysql://localhost:3306/sheji_diary?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&connectionCollation=utf8mb4_unicode_ci}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      table-prefix: ""
  mapper-locations: classpath*:/mapper/**/*.xml

file:
  # 文件上传目录，部署时可用 FILE_UPLOAD_DIR 覆盖
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}

jwt:
  # JWT 签名密钥，部署时务必用 JWT_SECRET 覆盖（至少 32 个字符），并可通过 JWT_EXPIRE 调整有效期（毫秒）
  secret: ${JWT_SECRET:sheji-diary-secret-key-2024-sheji-diary-secret-key}
  expire: ${JWT_EXPIRE:86400000}

cors:
  # 允许的前端来源（逗号分隔），部署时用 CORS_ALLOWED_ORIGINS 覆盖
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
