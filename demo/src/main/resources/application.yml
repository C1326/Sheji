server:
  port: 8080
  servlet:
    context-path: /api
  tomcat:
    max-swallow-size: 100MB

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/sheji_diary?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&connectionCollation=utf8mb4_unicode_ci
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      table-prefix: ""
  mapper-locations: classpath*:/mapper/**/*.xml

file:
  upload-dir: ./uploads

jwt:
  secret: sheji-diary-secret-key-2024-sheji-diary-secret-key
  expire: 86400000

cors:
  allowed-origins: "http://localhost:3000,http://localhost:3001"
